name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            suffix: linux-x64
          - os: ubuntu-latest
            rid: linux-arm64
            suffix: linux-arm64
          - os: windows-latest
            rid: win-x64
            suffix: win-x64
          - os: macos-latest
            rid: osx-x64
            suffix: osx-x64
          - os: macos-latest
            rid: osx-arm64
            suffix: osx-arm64
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Publish (${{ matrix.rid }})
        run: dotnet publish --configuration Release --runtime ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=embedded -p:Version=${{ github.ref_name }} --output ./publish/${{ matrix.rid }}

      - name: Determine artifact name
        id: artifact
        shell: bash
        run: |
          BASE="AtariHacker"
          case "${{ matrix.rid }}" in
            win-*) EXT=".exe" ;;
            *)     EXT="" ;;
          esac
          echo "name=${BASE}-${{ matrix.suffix }}${EXT}" >> "$GITHUB_OUTPUT"

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Move-Item -Path "./publish/${{ matrix.rid }}/AtariHacker.exe" -Destination "./publish/${{ matrix.rid }}/${{ steps.artifact.outputs.name }}" -Force

      - name: Rename binary (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          mv ./publish/${{ matrix.rid }}/AtariHacker ./publish/${{ matrix.rid }}/${{ steps.artifact.outputs.name }}

      - name: Create archive
        id: archive
        shell: bash
        run: |
          cd ./publish/${{ matrix.rid }}
          case "${{ matrix.rid }}" in
            win-*)
              7z a -tzip "../${{ steps.artifact.outputs.name }}.zip" "${{ steps.artifact.outputs.name }}"
              echo "ext=.zip" >> "$GITHUB_OUTPUT"
              ;;
            *)
              tar czf "../${{ steps.artifact.outputs.name }}.tar.gz" "${{ steps.artifact.outputs.name }}"
              echo "ext=.tar.gz" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: AtariHacker-${{ matrix.suffix }}
          path: ./publish/${{ steps.artifact.outputs.name }}${{ steps.archive.outputs.ext }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Build release notes
        id: notes
        shell: bash
        run: |
          cat <<'EOF' > ./release-notes.md
          ## AtariHacker ${{ github.ref_name }}

          ### Downloads

          | Platform | Archive |
          |----------|---------|
          EOF

          for f in ./artifacts/*/*.tar.gz ./artifacts/*/*.zip; do
            NAME=$(basename "$f")
            echo "| ${NAME} | \`${NAME}\` |" >> ./release-notes.md
          done

          echo "" >> ./release-notes.md
          echo "### Changes" >> ./release-notes.md
          echo "" >> ./release-notes.md
          echo "See the commit history for details." >> ./release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: AtariHacker ${{ github.ref_name }}
          body_path: ./release-notes.md
          files: |
            ./artifacts/*/*.tar.gz
            ./artifacts/*/*.zip
          generate_release_notes: true
